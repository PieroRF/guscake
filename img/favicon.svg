<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1022 1019" font-family="Georgia, 'Playfair Display', serif">
  <!-- Versión redondeada del logo para la pestaña del navegador.
       Mismo dibujo que img/logo.svg, recortado en círculo. -->
  <defs>
    <clipPath id="round"><circle cx="511" cy="509.5" r="509.5"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Fondos -->
    <rect x="0" y="0" width="1022" height="509" fill="#28110A"/>
    <rect x="0" y="509" width="1022" height="510" fill="#F9EFAF"/>

    <!-- Gorro de chef -->
    <g fill="none" stroke="#C99A4C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M498 300 h95 v20 h-95 z" fill="none"/>
      <path d="M503 300
               c-18 0 -30 -14 -30 -30
               c0 -16 13 -28 28 -28
               c2 -18 18 -32 37 -32
               c17 0 32 12 36 28
               c14 -6 30 3 32 19
               c2 18 -12 34 -30 34
               c-24 8 -49 8 -73 9 z"/>
      <line x1="498" y1="300" x2="498" y2="322"/>
      <line x1="593" y1="300" x2="593" y2="322"/>
      <line x1="498" y1="322" x2="593" y2="322"/>
    </g>

    <!-- Manga pastelera -->
    <g fill="none" stroke="#C99A4C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 245
               c10 -12 25 -18 40 -14
               c8 2 14 8 12 16
               c-3 12 3 22 14 24
               c10 2 15 10 12 18
               c-16 40 -55 68 -95 70
               c-14 1 -22 -9 -18 -22
               c8 -30 18 -62 35 -92 z"/>
      <path d="M400 245 l-32 -30" />
      <path d="M382 320 c10 8 22 10 33 6"/>
    </g>

    <!-- Torta -->
    <g fill="none" stroke="#C99A4C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M598 335
               c-6 -8 -6 -18 0 -26
               c6 -8 6 -14 0 -20"/>
      <path d="M513 344
               q10 -14 20 0
               q10 -14 20 0
               q10 -14 20 0
               q10 -14 20 0
               q10 -14 20 0
               v10
               h-100 z"/>
      <path d="M508 354 h110 v28 h-110 z"/>
    </g>

    <!-- Líneas decorativas junto a GUS -->
    <line x1="205" y1="472" x2="290" y2="472" stroke="#C99A4C" stroke-width="7"/>
    <line x1="740" y1="472" x2="825" y2="472" stroke="#C99A4C" stroke-width="7"/>

    <!-- Texto GUS -->
    <text x="511" y="500" font-size="185" font-weight="700" fill="#F5EBB8" text-anchor="middle" letter-spacing="2">Gus</text>

    <!-- Líneas decorativas junto a CAKE -->
    <line x1="200" y1="565" x2="300" y2="565" stroke="#28110A" stroke-width="7"/>
    <line x1="720" y1="565" x2="820" y2="565" stroke="#28110A" stroke-width="7"/>

    <!-- Texto CAKE -->
    <text x="511" y="680" font-size="180" font-weight="700" fill="#3A1A0C" text-anchor="middle" letter-spacing="2">Cake</text>
    <line x1="605" y1="595" x2="660" y2="595" stroke="#3A1A0C" stroke-width="6"/>
  </g>
</svg>
